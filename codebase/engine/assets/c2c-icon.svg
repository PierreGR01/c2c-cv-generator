     fichier, aucune retouche de coordonnee). Le viewBox est cadre exactement
     sur son etendue (x 361.89 -> 384.76, y 71.20 -> 91.79).

     POURQUOI DU VECTEUR : la version raster (c2c-icon.png, 2500x2247) etait
     rendue dans une boite de 18.75pt, soit ~25px a l'ecran — un facteur de
     reduction de 100. Les bords en escalier de l'ADN pixel-art y prenaient un
     halo gris-brun (alpha non premultiplie moyenne avec du blanc par les
     visionneuses PDF) : le "glitch gris" signale. En vecteur, plus aucun
     reechantillonnage : les aretes restent franches a toute echelle. -->
